services:
  api-gateway:
    build:
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ./api-gateway/src:/app/src
      - ./shared:/shared
    command: yarn dev

  identity-service:
    build:
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ./identity-service/src:/app/src
      - ./shared:/shared
    command: yarn dev

  passwords-service:
    build:
      args:
        NODE_ENV: development
    environment:
      NODE_ENV: development
    volumes:
      - ./passwords-service/src:/app/src
      - ./shared:/shared
    command: yarn dev
    
  python-service:
    volumes:
      - ./python-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 3004 --reload