services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      IDENTITY_SERVICE_URL: http://identity-service:3001
      PASSWORDS_SERVICE_URL: http://passwords-service:3003
      PYTHON_SERVICE_URL: http://python-service:3004
    restart: unless-stopped
  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: identity-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/identityDB
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME}
      LIMIT_SESSIONS: ${LIMIT_SESSIONS}
      BOOTSTRAP_SUPER_ADMIN_USERNAME: ${BOOTSTRAP_SUPER_ADMIN_USERNAME}
      DEFAULT_AREA_NAME: ${DEFAULT_AREA_NAME}
      PASSWORDS_SERVICE_URL: http://passwords-service:3003
    depends_on:
      - mongo
    restart: unless-stopped
  passwords-service:
    build:
      context: .
      dockerfile: passwords-service/Dockerfile
    container_name: passwords-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/passwordsDB
      CRYPTO_KEY: ${CRYPTO_KEY}
      IDENTITY_SERVICE_URL: http://identity-service:3001
    depends_on:
      - mongo
      - identity-service
    restart: unless-stopped
  python-service:
    build:
      context: .
      dockerfile: python-service/Dockerfile
    container_name: python-service
    ports:
      - "3004:3004"
    restart: unless-stopped
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  default:
    name: microservices-net