services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3001
      USERS_SERVICE_URL: http://users-service:3002
      PASSWORDS_SERVICE_URL: http://passwords-service:3003
      PYTHON_SERVICE_URL: http://python-service:3004
    restart: unless-stopped
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo:27017/authDB
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_TIME: ${JWT_EXPIRATION_TIME}
      LIMIT_SESSIONS: ${LIMIT_SESSIONS}
      USERS_SERVICE_URL: http://users-service:3002
    depends_on:
      - mongo
    restart: unless-stopped
  users-service:
    build:
      context: .
      dockerfile: users-service/Dockerfile
    container_name: users-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo:27017/usersDB
    depends_on:
      - mongo
    restart: unless-stopped
  passwords-service:
    build:
      context: .
      dockerfile: passwords-service/Dockerfile
    container_name: passwords-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo:27017/passwordsDB
      CRYPTO_KEY: ${CRYPTO_KEY}
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      - mongo
      - auth-service
    restart: unless-stopped
  python-service:
    build:
      context: .
      dockerfile: python-service/Dockerfile
    container_name: python-service
    ports:
      - "3004:3004"
    restart: unless-stopped
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  default:
    name: microservices-net